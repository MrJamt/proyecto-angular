<div class="row text-center my-4">
  <h1>Crear Tarea</h1>
</div>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card">
        <div class="card-body">
          <form [formGroup]="homeworkForm" (ngSubmit)="onSubmit()">

            <div class="mb-3">
              <label for="title" class="form-label">Titulo</label>
              <input type="text" class="form-control" [class.is-invalid]="isFieldInvalid('title')" id="title"
                formControlName="title" placeholder="Ingrese el titulo">
              <div class="invalid-feedback" *ngIf="isFieldInvalid('title')">
                {{ getErrorMessage('title') }}
              </div>
            </div>

            <div class="mb-3">
              <label for="description" class="form-label">Descripcion</label>
              <input type="text" class="form-control" [class.is-invalid]="isFieldInvalid('description')" id="description"
                formControlName="description" placeholder="Ingrese la descripcion">
              <div class="invalid-feedback" *ngIf="isFieldInvalid('description')">
                {{ getErrorMessage('description') }}
              </div>
            </div>

            <div class="mb-3">
              <label for="due_date" class="form-label">Fecha de Vencimiento</label>
              <input type="date" class="form-control" [class.is-invalid]="isFieldInvalid('due_date')" id="due_date"
                formControlName="due_date" placeholder="Ingrese la fecha de vencimiento">
              <div class="invalid-feedback" *ngIf="isFieldInvalid('due_date')">
                {{ getErrorMessage('due_date') }}
              </div>
            </div>

            <div class="mb-3">
              <label for="status" class="form-label">Estado</label>
              <select class="form-select" [class.is-invalid]="isFieldInvalid('status')" id="status" formControlName="status">
                <option *ngFor="let status of statuses" [value]="status">{{ status }}</option>
              </select>
              <div class="invalid-feedback" *ngIf="isFieldInvalid('status')">
                {{ getErrorMessage('status') }}
              </div>
            </div>

            <div class="d-flex gap-2 justify-content-end">
              <button type="button" class="btn btn-secondary" (click)="onCancel()" [disabled]="isSubmitting">
                Cancelar
              </button>
              <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
                {{ isSubmitting ? 'Guardando...' : 'Guardar' }}
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
